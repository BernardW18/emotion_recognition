[project]
name = "fer2013-emotion-recognition"
version = "0.1.0"
description = "FER2013 人脸情感识别 — PyTorch 训练 + Streamlit 推理"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.2",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "Pillow>=10.0",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "streamlit>=1.28",
    "ipywidgets>=8.0",
    "opencv-python>=4.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.1",
    "mypy>=1.5",
    "jupyter>=1.0",
    "ipykernel>=6.23",
]

[tool.setuptools.packages.find]
include = ["models*", "utils*", "data*", "training*", "inference*", "tools*", "tests*"]

[tool.ruff]
target-version = "py39"
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.ruff.per-file-ignores]
"notebooks/*.ipynb" = ["E402", "F401"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[project.urls]
Homepage = "https://github.com/BernardW18/fer2013-emotion-recognition"
Repository = "https://github.com/BernardW18/fer2013-emotion-recognition.git"
Documentation = "https://github.com/BernardW18/fer2013-emotion-recognition#readme"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
